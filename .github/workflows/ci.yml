name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  check:
    name: Build · Test · Quality · Dokka
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and unit tests
        run: ./gradlew check --stacktrace

      - name: Verify publishing metadata
        run: ./gradlew verifyPublishing --stacktrace

      - name: Dokka HTML
        run: ./gradlew dokkaHtmlAll --stacktrace
