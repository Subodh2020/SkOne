name: Publish

# Production release pipeline. Does NOT publish to Maven Central unless
# publish_central=true AND secrets are configured.
on:
  workflow_dispatch:
    inputs:
      publish_central:
        description: "Publish to Maven Central Portal (requires secrets)"
        type: boolean
        default: false
      create_github_release:
        description: "Create a GitHub Release for the current VERSION_NAME"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Validate · Build · Sign · Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Read VERSION_NAME
        id: version
        run: |
          VERSION=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"

      - name: Build
        run: ./gradlew assemble --stacktrace

      - name: Test
        run: ./gradlew check --stacktrace

      - name: Detekt
        run: ./gradlew detekt --stacktrace
        continue-on-error: true

      - name: Ktlint
        run: ./gradlew ktlintCheck --stacktrace
        continue-on-error: true

      - name: Dokka
        run: ./gradlew dokkaHtmlAll --stacktrace

      - name: Verify publishing
        run: ./gradlew verifyPublishing --stacktrace

      - name: Publish to Maven Local
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishToMavenLocal --stacktrace

      - name: Publish to local test repository
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishToLocalTestRepository --stacktrace

      # Maven Central is opt-in. Milestone 1.3.2 prepares infra only —
      # keep publish_central=false until you are ready to release.
      - name: Publish to Maven Central Portal
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_central }}
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
        run: |
          if [ -z "$CENTRAL_PORTAL_USERNAME" ] || [ -z "$CENTRAL_PORTAL_PASSWORD" ]; then
            echo "Central Portal secrets missing."
            exit 1
          fi
          if [ -z "$SIGNING_KEY" ]; then
            echo "SIGNING_KEY is required for Maven Central."
            exit 1
          fi
          ./gradlew publishReleasePublicationToCentralPortalRepository --stacktrace

      - name: Upload local Maven repo artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-maven-repo
          path: build/local-maven-repo

      - name: Create GitHub Release
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.create_github_release) || startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: SKOne ${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: ${{ contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'SNAPSHOT') }}
