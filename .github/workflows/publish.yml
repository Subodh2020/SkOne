name: Publish

# Skeleton only — configure Maven Central credentials before enabling releases.
on:
  workflow_dispatch:

jobs:
  publish:
    name: Publish to Maven Local (placeholder)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Publish to Maven Local
        run: ./gradlew publishToMavenLocal --stacktrace

      # TODO: Replace with Maven Central / Sonatype publishing once credentials are available.
      # Required secrets (planned): OSSRH_USERNAME, OSSRH_PASSWORD, SIGNING_KEY, SIGNING_PASSWORD
