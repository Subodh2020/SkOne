# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------------
# SKOne publishing — single source of truth
# ---------------------------------------------------------------------------
# Maven Central group (verified namespace)
GROUP=com.thesubodhgupta.skone

# Semantic version with optional pre-release label:
#   1.3.2-alpha01 | 1.3.2-beta01 | 1.3.2-rc01 | 1.3.2 | 1.3.2-SNAPSHOT
VERSION_NAME=1.3.2-alpha05

# Backward-compatible aliases (read by older scripts)
skone.group=com.thesubodhgupta.skone
skone.version=1.3.2-alpha05
